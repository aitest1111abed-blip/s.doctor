<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="tokens.css?v=1"><link rel="stylesheet" href="styles.css?v=242"></head>
<body>
<main style="max-width:100%;padding:20px 16px;display:flex;flex-direction:column;gap:14px;">
  <nav class="dbside" id="mainRail">
    <div class="dbside-head"><span class="dbside-mark"><img src="./icon-192.png" alt="D"></span></div>
    <div class="dbside-scroll"><ul class="dbside-list">
      <li><button class="menu-item sidebar-item active" aria-label="الرئيسية"><i class="fas fa-house"></i><span>x</span></button></li>
      <li><button class="menu-item sidebar-item" aria-label="المواعيد"><i class="fas fa-calendar-alt"></i><span>x</span></button></li>
      <li><button class="menu-item sidebar-item" aria-label="دفتر المرضى"><i class="fas fa-address-book"></i><span>x</span></button></li>
    </ul></div>
    <div class="dbside-foot"><div class="dbside-div"></div><button class="menu-item" aria-label="الإعدادات"><i class="fas fa-cog"></i><span>x</span></button><div class="dbside-profile" style="position:relative;"><button class="topbar-chip"><span class="topbar-avatar"><i class="fas fa-user-md"></i></span></button></div></div>
  </nav>
  <div class="content-area"><section>
    <h1 style="font-size:1.4rem;font-weight:700;color:var(--text-primary);margin:0;">صباح الخير، دكتور أحمد</h1>
    <p style="color:var(--text-muted);margin:4px 0 0;font-size:.85rem;">السبت، ٣٠ آب ٢٠٢٦</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;">
      <div class="glass-card"><span class="kpi-n">12</span><div class="kpi-t">مواعيد اليوم</div></div>
      <div class="glass-card"><span class="kpi-n">6</span><div class="kpi-t">زاروا</div></div>
      <div class="glass-card"><span class="kpi-n">5</span><div class="kpi-t">متبقّية</div></div>
    </div>
    <div class="glass-card" style="margin-top:12px;padding:16px;">
      <div style="font-weight:700">أحدث الزيارات</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn-primary">+ زيارة</button><button class="btn-secondary">طباعة</button></div>
    </div>
  </section></div>
</main></body></html>
